<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta nstyleviewport="content="width=device-width, initial-scale=1.0">
    <title>Family Image Map</title>
    <style>
      
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            
            background-color: #FFF0F5; 
            margin: 20px;
          
            color: #4A1525; 
        }

        
        h1 {
            color: #D81B60;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        p {
            color: #C2185B;
            font-weight: bold;
        }
        
        .photo-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin: auto;
        }

        .photo-wrapper img {
            display: block;
            max-width: 100%;
            height: auto;
        
            border: 5px solid #FFE4E1; 
            
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.2); 
        }

        .click-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; 
        }
        
        .face-link {
            text-decoration: none;
            background-color: rgba(255, 255, 255, 0); 
            
            -webkit-tap-highlight-color: rgba(235, 104, 161, 0.3);
        }

        
        .face-link:hover {
            background-color: rgba(244, 143, 177, 0.15);
            transition: background-color 0.2s ease;
        }
    </style>
</head>
